name: Mantener Supabase despierto
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/keepalive.mjs
      # En repos públicos GitHub apaga los cron tras 60 días sin cambios; esto lo mantiene encendido.
      - run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
